const isEligibleToDonate = (lastDonation) => {
  if (!lastDonation) return true;
  const diff = (Date.now() - new Date(lastDonation)) / (1000*60*60*24);
  return diff >= 56;
};

const daysSince = (date) => {
  if (!date) return null;
  return Math.floor((Date.now() - new Date(date)) / (1000*60*60*24));
};

// ─── TOAST ─────────────────────────────────────────────────────────────────────
const Toast = ({ message, type="success", onClose }) => {
  useEffect(() => {
    const t = setTimeout(onClose, 3500);
    return () => clearTimeout(t);
  }, [onClose]);
  const colors = { success: COLORS.success, error: COLORS.crimson, info: COLORS.info };
  return (
    <div className="toast">
      <div style={{ width:8, height:8, borderRadius:"50%", background: colors[type], flexShrink:0 }} />
      <span>{message}</span>
      <button className="btn-ghost" onClick={onClose} style={{ padding:"2px", marginLeft:"auto" }}>
        <Icon name="close" size={14} color={COLORS.muted} />
      </button>
    </div>
  );
};

// ─── OTP MODAL ─────────────────────────────────────────────────────────────────
const OtpModal = ({ donor, onSuccess, onClose }) => {
  const [otp, setOtp] = useState(["","","","",""]);
  const [sent, setSent] = useState(false);
  const [loading, setLoading] = useState(false);
  const [revealed, setRevealed] = useState(false);
  const DEMO_OTP = "12345";

  const sendOtp = () => {
    setLoading(true);
    setTimeout(() => { setSent(true); setLoading(false); }, 1200);
  };

  const verifyOtp = () => {
    const entered = otp.join("");
    if (entered === DEMO_OTP) {
      setRevealed(true);
      // Save request
      DB.requests.push({
        id: generateId(),
        patientId: DB.currentUser?.id || "guest",
        donorId: donor.id,
        donorName: donor.name,
        patientName: DB.currentUser?.name || "Guest User",
        bloodGroup: donor.bloodGroup,
        city: donor.city,
        status: "Approved",
        timestamp: new Date().toISOString(),
        otpVerified: true,
      });
      onSuccess(donor);
    } else {
      setOtp(["","","","",""]);
    }
  };

  const handleOtpChange = (i, val) => {
    if (!/^\d?$/.test(val)) return;
    const next = [...otp]; next[i] = val;
    setOtp(next);
    if (val && i < 4) document.getElementById(`otp-${i+1}`)?.focus();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start", marginBottom:24 }}>
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
              <Icon name="shield" size={20} color={COLORS.crimson} />
              <h2 style={{ fontSize:20, fontWeight:700 }}>Secure Contact Reveal</h2>
            </div>
            <p style={{ fontSize:14, color:COLORS.muted }}>Verify your identity to access donor contact details</p>
          </div>
          <button className="btn-ghost" onClick={onClose} style={{ padding:6 }}>
            <Icon name="close" size={18} color={COLORS.muted} />
          </button>
        </div>

        {revealed ? (
          <div style={{ animation:"fadeUp 0.4s ease" }}>
            <div style={{ background: "#F0FDF4", border:"1px solid #86EFAC", borderRadius:12, padding:20, marginBottom:20 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                <div style={{ background:COLORS.success, borderRadius:"50%", padding:4, display:"flex" }}>
                  <Icon name="check" size={14} color="white" />
                </div>
                <span style={{ fontWeight:600, color:COLORS.success }}>Identity Verified</span>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <div className="blood-badge">{donor.bloodGroup}</div>
                  <div>
                    <div style={{ fontWeight:700, fontSize:18 }}>{donor.name}</div>
                    <div style={{ fontSize:13, color:COLORS.muted }}>{donor.city}</div>
                  </div>
                </div>
                <div style={{ borderTop:`1px solid #86EFAC`, paddingTop:12, display:"flex", flexDirection:"column", gap:8 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <Icon name="phone" size={16} color={COLORS.success} />
                    <span style={{ fontWeight:600, fontSize:16 }}>{donor.mobile}</span>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>

const DEMO_LOGIN_OTP = "12345";

const LoginPage = ({ onNavigate, onLogin, addToast }) => {
  const [step, setStep] = useState("email"); // "email" | "otp"
  const [email, setEmail] = useState("");
  const [otp, setOtp] = useState(["","","","",""]);
  const [loading, setLoading] = useState(false);
  const [resolvedUser, setResolvedUser] = useState(null);
  const [resendTimer, setResendTimer] = useState(0);

  useEffect(() => {
    if (resendTimer > 0) {
      const t = setTimeout(() => setResendTimer(s => s-1), 1000);
      return () => clearTimeout(t);
    }
  }, [resendTimer]);

  const sendOtp = () => {
    if (!email) { addToast("Enter your email address", "error"); return; }
    // Admin check
    if (email === ADMIN.email) {
      setResolvedUser(ADMIN);
      setLoading(true);
      setTimeout(() => { setStep("otp"); setLoading(false); setResendTimer(30); }, 1000);
      return;
    }
    const user = DB.users.find(u => u.email === email);
    if (!user) { addToast("Email not registered. Please sign up first.", "error"); return; }
    setResolvedUser(user);
    setLoading(true);
    setTimeout(() => { setStep("otp"); setLoading(false); setResendTimer(30); }, 1000);
  };

  const verifyOtp = () => {
    const entered = otp.join("");
    if (entered.length !== 5) { addToast("Enter all 5 digits", "error"); return; }
    if (entered !== DEMO_LOGIN_OTP) {
      addToast("Incorrect OTP. Try 12345 for demo.", "error");
      setOtp(["","","","",""]);
      document.getElementById("lotp-0")?.focus();
      return;
    }
    DB.currentUser = resolvedUser;
    onLogin(resolvedUser);
    addToast(`Welcome${resolvedUser.isAdmin ? ", Admin" : ` back, ${resolvedUser.name}`}! 🩸`, "success");
  };

  const handleOtpKey = (i, val, e) => {
    if (!/^\d?$/.test(val)) return;
    const next = [...otp]; next[i] = val; setOtp(next);
    if (val && i < 4) document.getElementById(`lotp-${i+1}`)?.focus();
    if (e.key === "Backspace" && !val && i > 0) document.getElementById(`lotp-${i-1}`)?.focus();
  };

  return (
    <div style={{ minHeight:"100vh", background:`linear-gradient(135deg, ${COLORS.charcoal} 0%, ${COLORS.slate} 60%, #3D1A1A 100%)`, display:"flex", alignItems:"center", justifyContent:"center", padding:24, position:"relative", overflow:"hidden" }}>
      {[...Array(5)].map((_,i) => (
        <div key={i} style={{ position:"absolute", top:`${10+i*18}%`, right:`${4+i*10}%`, opacity:0.05+i*0.015, animation:`float ${3+i*0.6}s ease-in-out infinite`, animationDelay:`${i*0.4}s` }}>
          <Icon name="drop" size={20+i*10} color="white" />
        </div>
      ))}
      <div style={{ width:"100%", maxWidth:440, position:"relative", zIndex:1 }}>
        <div style={{ textAlign:"center", marginBottom:32, animation:"fadeUp 0.5s ease both" }}>
          <div style={{ display:"inline-flex", background:COLORS.crimson, borderRadius:16, padding:14, marginBottom:16, boxShadow:"0 8px 32px rgba(200,16,46,0.4)" }}>
            <Icon name="drop" size={30} color="white" />
          </div>
          <h1 className="display-font" style={{ color:"white", fontSize:34, marginBottom:8 }}>Welcome Back</h1>
          <p style={{ color:"rgba(255,255,255,0.6)", fontSize:15 }}>Sign in with OTP — no password needed</p>
        </div>

        <div style={{ background:"rgba(255,255,255,0.07)", backdropFilter:"blur(16px)", borderRadius:20, padding:32, border:"1px solid rgba(255,255,255,0.12)", animation:"fadeUp 0.5s ease 0.1s both", boxShadow:"0 24px 64px rgba(0,0,0,0.3)" }}>
          {step === "email" ? (
            <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
              <div>
                <label style={{ display:"block", fontSize:13, fontWeight:600, color:"rgba(255,255,255,0.5)", marginBottom:8, textTransform:"uppercase", letterSpacing:0.5 }}>Email Address</label>
                <input
                  className="input-field"
                  type="email"
                  placeholder="your@email.com"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  onKeyDown={e => e.key==="Enter" && sendOtp()}
                  style={{ background:"rgba(255,255,255,0.1)", border:"1.5px solid rgba(255,255,255,0.15)", color:"white", fontSize:16 }}
                />
                <p style={{ fontSize:12, color:"rgba(255,255,255,0.4)", marginTop:6 }}>Admin: admin@bloodlink.com · OTP: <strong style={{color:"rgba(255,255,255,0.6)"}}>12345</strong></p>
              </div>
              <button className="btn-primary" style={{ width:"100%", justifyContent:"center", padding:"14px", fontSize:16, background:COLORS.crimson, boxShadow:"0 4px 20px rgba(200,16,46,0.4)" }} onClick={sendOtp} disabled={loading}>
                {loading ? <div className="spinner" style={{ borderTopColor:"white", borderColor:"rgba(255,255,255,0.3)" }} /> : <Icon name="phone" size={16} color="white" />}
                {loading ? "Sending OTP..." : "Send OTP"}
              </button>
              <div style={{ textAlign:"center" }}>
                <span style={{ color:"rgba(255,255,255,0.4)", fontSize:14 }}>New donor? </span>
                <button className="btn-ghost" style={{ color:COLORS.crimsonLight, fontWeight:600, padding:"0 4px" }} onClick={() => onNavigate("register")}>Register here</button>
              </div>
            </div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:20, animation:"fadeUp 0.4s ease both" }}>
              <div style={{ textAlign:"center" }}>
                <div style={{ width:52, height:52, borderRadius:12, background:"rgba(200,16,46,0.2)", border:"1px solid rgba(200,16,46,0.4)", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 12px" }}>
                  <Icon name="shield" size={24} color={COLORS.crimsonLight} />
                </div>
                <p style={{ color:"rgba(255,255,255,0.7)", fontSize:14 }}>OTP sent to <strong style={{color:"white"}}>{email}</strong></p>
                <p style={{ color:"rgba(255,255,255,0.4)", fontSize:12, marginTop:4 }}>Enter <strong style={{color:"rgba(255,255,255,0.6)"}}>12345</strong> for demo</p>
              </div>
              <div style={{ display:"flex", gap:8, justifyContent:"center" }}>
                {otp.map((d,i) => (
                  <input
                    key={i}
                    id={`lotp-${i}`}
                    className="otp-input"
                    type="text"
                    inputMode="numeric"
                    maxLength={1}
                    value={d}
                    onChange={e => handleOtpKey(i, e.target.value, e)}
                    onKeyDown={e => { if(e.key==="Backspace"){ const next=[...otp]; if(!next[i]&&i>0){ next[i-1]=""; setOtp(next); document.getElementById(`lotp-${i-1}`)?.focus(); } else { next[i]=""; setOtp(next); } } }}
                    style={{ background:"rgba(255,255,255,0.1)", border:`2px solid ${d ? COLORS.crimsonLight : "rgba(255,255,255,0.15)"}`, color:"white", transition:"border-color 0.2s" }}
                  />
                ))}
              </div>
              <button className="btn-primary" style={{ width:"100%", justifyContent:"center", padding:"14px", fontSize:16, background:COLORS.crimson, boxShadow:"0 4px 20px rgba(200,16,46,0.4)" }} onClick={verifyOtp} disabled={otp.join("").length !== 5}>
                <Icon name="check" size={16} color="white" />
                Verify & Sign In
              </button>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <button className="btn-ghost" style={{ color:"rgba(255,255,255,0.5)", fontSize:13 }} onClick={() => { setStep("email"); setOtp(["","","","",""]); }}>
                  ← Change email
                </button>
                {resendTimer > 0 ? (
                  <span style={{ fontSize:13, color:"rgba(255,255,255,0.4)" }}>Resend in {resendTimer}s</span>
                ) : (
                  <button className="btn-ghost" style={{ color:COLORS.crimsonLight, fontSize:13, fontWeight:600 }} onClick={() => { setOtp(["","","","",""]); setResendTimer(30); addToast("OTP resent!", "success"); }}>
                    Resend OTP
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ─── SEARCH PAGE ───────────────────────────────────────────────────────────────
const SearchPage = ({ currentUser, addToast }) => {
  const [filters, setFilters] = useState({ bloodGroup:"", city:"", status:"", compatible:false });
  const [results, setResults] = useState(DB.users);
  const [otpDonor, setOtpDonor] = useState(null);
  const [revealedIds, setRevealedIds] = useState([]);
  const setF = (k,v) => setFilters(f => ({...f,[k]:v}));

  const search = useCallback(() => {
    let res = DB.users.filter(u => u.id !== currentUser?.id);
    if (filters.bloodGroup) {
      if (filters.compatible) {
        const compat = BG_COMPATIBILITY[filters.bloodGroup] || [];
        res = res.filter(u => compat.includes(u.bloodGroup));
      } else {
        res = res.filter(u => u.bloodGroup === filters.bloodGroup);
      }
    }
    if (filters.city) res = res.filter(u => u.city === filters.city);
    if (filters.status) res = res.filter(u => u.status === filters.status);
    // Sort: Available first
    res.sort((a,b) => {
      const order = { Available:0, Busy:1, "Recently Donated":2 };
      return (order[a.status]||99) - (order[b.status]||99);
    });
    setResults(res);
  }, [filters, currentUser]);

  useEffect(() => { search(); }, [search]);

  const handleRequest = (donor) => {
    if (!currentUser) { addToast("Please login to request contact", "error"); return; }
    setOtpDonor(donor);
  };

  const handleOtpSuccess = (donor) => {
    setRevealedIds(ids => [...ids, donor.id]);
    setOtpDonor(null);
    addToast(`Contact revealed for ${donor.name}`, "success");
  };

  const available = results.filter(d=>d.status==="Available").length;

  return (
    <div style={{ padding:"32px 24px", maxWidth:1100, margin:"0 auto" }}>
      {otpDonor && <OtpModal donor={otpDonor} onSuccess={handleOtpSuccess} onClose={() => setOtpDonor(null)} />}

      <div style={{ marginBottom:28 }}>
        <h1 className="section-title">Find Blood Donors</h1>
        <p style={{ color:COLORS.muted }}>Search across {DB.users.length} registered donors in real time</p>
      </div>

      {/* Filters */}
      <div className="card" style={{ padding:24, marginBottom:28 }}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(160px,1fr))", gap:14, marginBottom:16 }}>
          <div>
            <label className="label">Blood Group</label>
            <select className="input-field" value={filters.bloodGroup} onChange={e=>setF("bloodGroup",e.target.value)}>
              <option value="">All Groups</option>
              {BLOOD_GROUPS.map(b=><option key={b}>{b}</option>)}
            </select>
          </div>
          <div>
            <label className="label">City</label>
            <select className="input-field" value={filters.city} onChange={e=>setF("city",e.target.value)}>
              <option value="">All Cities</option>
              {CITIES.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="label">Status</label>
            <select className="input-field" value={filters.status} onChange={e=>setF("status",e.target.value)}>
              <option value="">All Status</option>
              {STATUS_OPTIONS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
        {filters.bloodGroup && (
          <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:14, color:COLORS.muted }}>
            <input type="checkbox" checked={filters.compatible} onChange={e=>setF("compatible",e.target.checked)} style={{ accentColor:COLORS.crimson }} />
            Show compatible donors for <strong style={{ color:COLORS.charcoal }}>{filters.bloodGroup}</strong>
          </label>
        )}
      </div>

      {/* Results */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16, flexWrap:"wrap", gap:8 }}>
        <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
          <span style={{ fontWeight:600, color:COLORS.charcoal }}>{results.length} donors found</span>
          {available > 0 && (
            <span className="badge" style={{ background:"#DCFCE7", color:"#166534" }}>
              <div style={{ width:6, height:6, borderRadius:"50%", background:"#16A34A" }} />
              {available} Available Now
            </span>
          )}
        </div>
        <div style={{ display:"flex", gap:6 }}>
          {filters.bloodGroup && <span className="badge" style={{ background:COLORS.warm, color:COLORS.crimson, border:`1px solid ${COLORS.border}` }}>{filters.bloodGroup}</span>}
          {filters.city && <span className="badge" style={{ background:COLORS.warm, color:COLORS.slate, border:`1px solid ${COLORS.border}` }}>{filters.city}</span>}
        </div>
      </div>

      {results.length === 0 ? (
        <div style={{ textAlign:"center", padding:"60px 24px", color:COLORS.muted }}>
          <div style={{ fontSize:48, marginBottom:12 }}>🔍</div>
          <div style={{ fontSize:18, fontWeight:600, marginBottom:8 }}>No donors found</div>
          <div style={{ fontSize:14 }}>Try adjusting your filters</div>
        </div>
      ) : (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(280px,1fr))", gap:16 }}>
          {results.map((d,i) => (
            <div key={d.id} style={{ animation:`fadeUp 0.4s ease forwards`, animationDelay:`${i*0.04}s`, opacity:0 }}>
              <DonorCard
                donor={d}
                onRequest={handleRequest}
                showRequest={!revealedIds.includes(d.id)}
              />
              {revealedIds.includes(d.id) && (
                <div style={{ marginTop:8, padding:"10px 14px", background:"#F0FDF4", borderRadius:10, border:"1px solid #86EFAC", fontSize:13, color:COLORS.success, display:"flex", gap:8 }}>
                  <Icon name="check" size={14} color={COLORS.success} />
                  Contact revealed: {d.mobile}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ─── LAYOUT + NAVIGATION ───────────────────────────────────────────────────────
const Sidebar = ({ page, onNavigate, currentUser, onLogout }) => {
  const navItems = [
    { id:"home", icon:"home", label:"Home" },
    { id:"search", icon:"search", label:"Find Donors" },
    { id:"dashboard", icon:"dashboard", label:"Dashboard" },
    { id:"history", icon:"history", label:"Request History" },
    ...(currentUser ? [{ id:"profile", icon:"user", label:"My Profile" }] : []),
  ];

  return (
    <div style={{
      width:220, background:"white", borderRight:`1px solid ${COLORS.border}`,
      display:"flex", flexDirection:"column", padding:"20px 12px",
      position:"sticky", top:0, height:"100vh", flexShrink:0,
    }}>
      {/* Logo */}
      <div style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 8px 24px" }}>
        <div style={{ background:COLORS.crimson, borderRadius:10, padding:8, display:"flex" }}>
          <Icon name="drop" size={18} color="white" />
        </div>
        <div>
          <div style={{ fontFamily:"'Playfair Display', serif", fontWeight:700, fontSize:14, lineHeight:1.1 }}>BloodLink</div>
          <div style={{ fontSize:10, color:COLORS.muted, letterSpacing:0.5 }}>DONOR REGISTRY</div>
        </div>
      </div>

      {/* Nav */}
      <nav style={{ display:"flex", flexDirection:"column", gap:4, flex:1 }}>
        {navItems.map((item,idx) => (
          <button key={item.id} className={`nav-link ${page===item.id?"active":""}`} onClick={() => onNavigate(item.id)} style={{ animation:"slideIn 0.35s ease both", animationDelay:`${idx*0.06}s` }}>
            <Icon name={item.icon} size={17} color={page===item.id ? "white" : COLORS.muted} />
            {item.label}
          </button>
        ))}
      </nav>

      {/* SOS Button */}
      <div style={{ margin:"12px 0" }}>
        <button className="btn-primary" style={{ width:"100%", justifyContent:"center", background:"#DC2626", fontSize:13, padding:"10px" }} onClick={()=>{}}>
          <Icon name="sos" size={15} color="white" />
          SOS Emergency
        </button>
      </div>

      {/* User section */}
      <div style={{ borderTop:`1px solid ${COLORS.border}`, paddingTop:12 }}>
        {currentUser ? (
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 10px", marginBottom:4 }}>
              <div style={{ width:32, height:32, borderRadius:8, background:COLORS.crimson, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <span style={{ color:"white", fontWeight:700, fontSize:currentUser.isAdmin?10:13 }}>{currentUser.isAdmin ? "ADM" : currentUser.bloodGroup}</span>
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontWeight:600, fontSize:13, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{currentUser.name}</div>
                <div style={{ fontSize:11, color:COLORS.muted }}>{currentUser.isAdmin ? "Administrator" : currentUser.city}</div>
              </div>
            </div>
            <button className="nav-link" style={{ color:COLORS.crimson }} onClick={onLogout}>
              <Icon name="logout" size={16} color={COLORS.crimson} />
              Sign Out
            </button>
          </div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            <button className="btn-primary" style={{ width:"100%", justifyContent:"center", fontSize:13, padding:10 }} onClick={() => onNavigate("login")}>Sign In</button>
            <button className="btn-secondary" style={{ width:"100%", justifyContent:"center", fontSize:13, padding:9 }} onClick={() => onNavigate("register")}>Register</button>
          </div>
        )}
      </div>
    </div>
  );
};

const TopBar = ({ page, onNavigate, currentUser, onLogout, mobileMenuOpen, setMobileMenuOpen }) => (
  <div style={{ background:"white", borderBottom:`1px solid ${COLORS.border}`, padding:"12px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", position:"sticky", top:0, zIndex:100 }}>
    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
      <button onClick={() => setMobileMenuOpen(s=>!s)} style={{ background:"none", border:"none", cursor:"pointer", display:"flex", padding:4 }}>
        <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={COLORS.charcoal} strokeWidth="2">
          {mobileMenuOpen ? <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></> : <><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></>}
        </svg>
      </button>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        <div style={{ background:COLORS.crimson, borderRadius:8, padding:6, display:"flex" }}>
          <Icon name="drop" size={14} color="white" />
        </div>
        <span style={{ fontFamily:"'Playfair Display', serif", fontWeight:700, fontSize:16 }}>BloodLink</span>
      </div>
    </div>
    <div style={{ display:"flex", gap:8 }}>
      {!currentUser ? (
        <>
          <button className="btn-ghost" style={{ fontSize:13, color:COLORS.muted }} onClick={() => onNavigate("login")}>Sign In</button>
          <button className="btn-primary" style={{ fontSize:13, padding:"8px 16px" }} onClick={() => onNavigate("register")}>Register</button>
        </>
      ) : (
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <div style={{ width:30, height:30, borderRadius:8, background:COLORS.crimson, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <span style={{ color:"white", fontWeight:700, fontSize:10 }}>{currentUser.isAdmin ? "ADM" : currentUser.bloodGroup}</span>
          </div>
          <span style={{ fontSize:13, fontWeight:600 }}>{currentUser.name.split(" ")[0]}</span>
        </div>
      )}
    </div>
  </div>
);

// ─── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [currentUser, setCurrentUser] = useState(null);
  const [toast, setToast] = useState(null);
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" ? window.innerWidth < 768 : false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  useEffect(() => {
    const handleResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, []);

  const addToast = useCallback((message, type="success") => {
    setToast({ message, type, id: Date.now() });
  }, []);

  const navigate = useCallback((p) => {
    setPage(p);
    setMobileMenuOpen(false);
    window.scrollTo(0,0);
  }, []);

  const handleLogin = (user) => {
    setCurrentUser(user);
    setPage("dashboard");
  };

  const handleLogout = () => {
    DB.currentUser = null;
    setCurrentUser(null);
    setPage("home");
    addToast("Signed out successfully", "info");
  };

  const handleUpdateProfile = (updated) => {
    setCurrentUser(updated);
  };

  const renderPage = () => {
    switch(page) {
      case "home": return <LandingPage onNavigate={navigate} currentUser={currentUser} />;
      case "login": return <AuthPage mode="login" onNavigate={navigate} onLogin={handleLogin} addToast={addToast} />;
      case "register": return <AuthPage mode="register" onNavigate={navigate} onLogin={handleLogin} addToast={addToast} />;
      case "profile": return currentUser ? <ProfilePage user={currentUser} onUpdate={handleUpdateProfile} addToast={addToast} /> : <AuthPage mode="login" onNavigate={navigate} onLogin={handleLogin} addToast={addToast} />;
      case "search": return <SearchPage currentUser={currentUser} addToast={addToast} />;
      case "dashboard": return <DashboardPage />;
      case "history": return <HistoryPage currentUser={currentUser} />;
      default: return <LandingPage onNavigate={navigate} />;
    }
  };

  const showSidebar = !["login","register"].includes(page);

  return (
    <>
      <GlobalStyle />
      {toast && (
        <Toast
          key={toast.id}
          message={toast.message}
          type={toast.type}
          onClose={() => setToast(null)}
        />
      )}

      {["login","register"].includes(page) ? (
        renderPage()
      ) : (
        <div style={{ display:"flex", minHeight:"100vh" }}>
          {/* Desktop sidebar */}
          {!isMobile && showSidebar && (
            <Sidebar page={page} onNavigate={navigate} currentUser={currentUser} onLogout={handleLogout} />
          )}

          {/* Mobile sidebar overlay */}
          {isMobile && mobileMenuOpen && (
            <div style={{ position:"fixed", inset:0, zIndex:200, display:"flex" }}>
              <div style={{ width:240, height:"100%", background:"white", borderRight:`1px solid ${COLORS.border}`, padding:"20px 12px", display:"flex", flexDirection:"column", overflowY:"auto" }}>
                <Sidebar page={page} onNavigate={navigate} currentUser={currentUser} onLogout={handleLogout} />
              </div>
              <div style={{ flex:1, background:"rgba(0,0,0,0.4)" }} onClick={() => setMobileMenuOpen(false)} />
            </div>
          )}

          <div style={{ flex:1, minWidth:0, display:"flex", flexDirection:"column" }}>
            {isMobile && (
              <TopBar page={page} onNavigate={navigate} currentUser={currentUser} onLogout={handleLogout} mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen} />
            )}
            <main style={{ flex:1, overflowY:"auto" }}>
              <div key={page} className="page-enter">{renderPage()}</div>
            </main>
          </div>
        </div>
      )}
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
